backend:
  name: git-gateway
  branch: main

media_folder: imagens
public_folder: /imagens

locale: pt

collections:

  # ─── CONFIGURAÇÕES GERAIS ───────────────────────────
  - name: "configuracoes"
    label: "⚙️ Configurações Gerais"
    files:
      - name: "geral"
        label: "Informações da Igreja"
        file: "content/geral.json"
        fields:
          - { label: "Nome da Igreja", name: "nome", widget: "string", default: "Igreja do Evangelho Quadrangular Tangará" }
          - { label: "Frase Principal (Hero)", name: "frase_hero", widget: "string", default: "Jesus Cristo é o mesmo, ontem, hoje e eternamente." }
          - { label: "Endereço Atual", name: "endereco", widget: "string", default: "Rua Ilton Resitano, 164 — Jardim Tangará, São Carlos – SP" }
          - { label: "WhatsApp", name: "whatsapp", widget: "string", default: "5519992417277" }
          - { label: "Instagram da Igreja", name: "instagram_igreja", widget: "string", default: "quadrangular.tangara" }
          - { label: "Instagram Jovens", name: "instagram_jovens", widget: "string", default: "influentes_ieqtangara" }
          - { label: "Instagram Dança Vyrtud", name: "instagram_danca", widget: "string", default: "vyrtud_tangara" }
          - { label: "Imagem do Hero (foto do culto)", name: "imagem_hero", widget: "image" }
          - { label: "Aviso do Novo Templo", name: "aviso_templo", widget: "string", default: "Novo templo em breve 🙌" }
          - { label: "Foto do Novo Templo", name: "foto_templo", widget: "image" }
          - { label: "Anos da Igreja em Tangará", name: "anos_tangara", widget: "string", default: "— anos servindo Tangará" }

  # ─── CULTOS ───────────────────────────────────────
  - name: "cultos"
    label: "⛪ Cultos"
    files:
      - name: "horarios"
        label: "Horários dos Cultos"
        file: "content/cultos.json"
        fields:
          - label: "Domingo"
            name: "domingo"
            widget: "object"
            fields:
              - { label: "Horário 1", name: "horario1", widget: "string", default: "9h00" }
              - { label: "Tipo 1", name: "tipo1", widget: "string", default: "Culto da Manhã" }
              - { label: "Horário 2", name: "horario2", widget: "string", default: "19h00" }
              - { label: "Tipo 2", name: "tipo2", widget: "string", default: "Culto da Noite" }
          - label: "Terça-feira"
            name: "terca"
            widget: "object"
            fields:
              - { label: "Horário 1", name: "horario1", widget: "string", default: "20h00" }
              - { label: "Tipo 1", name: "tipo1", widget: "string", default: "Escola do Crescimento" }
              - { label: "Horário 2", name: "horario2", widget: "string", default: "21h00" }
              - { label: "Tipo 2", name: "tipo2", widget: "string", default: "Uniora — Reunião de Oração" }
          - label: "Quinta-feira"
            name: "quinta"
            widget: "object"
            fields:
              - { label: "Horário", name: "horario", widget: "string", default: "20h00" }
              - { label: "Tipo", name: "tipo", widget: "string", default: "Culto de Campanha" }

  # ─── LIDERANÇA ───────────────────────────────────
  - name: "lideranca"
    label: "👥 Liderança"
    files:
      - name: "pastores"
        label: "Pastores"
        file: "content/pastores.json"
        fields:
          - label: "Pastor Titular"
            name: "pastor"
            widget: "object"
            fields:
              - { label: "Nome", name: "nome", widget: "string", default: "Marcelo Garcia" }
              - { label: "Cargo", name: "cargo", widget: "string", default: "Pastor Titular" }
              - { label: "Foto", name: "foto", widget: "image" }
          - label: "Pastora"
            name: "pastora"
            widget: "object"
            fields:
              - { label: "Nome", name: "nome", widget: "string", default: "Andréia Garcia" }
              - { label: "Cargo", name: "cargo", widget: "string", default: "Pastora" }
              - { label: "Foto", name: "foto", widget: "image" }

  # ─── JOVENS INFLUENTES ───────────────────────────
  - name: "jovens"
    label: "⚡ Jovens Influentes"
    files:
      - name: "info"
        label: "Informações dos Jovens"
        file: "content/jovens.json"
        fields:
          - { label: "Frase dos Jovens", name: "frase", widget: "string", default: "Jovens que influenciam, não são influenciados" }
          - label: "Líder 1"
            name: "lider1"
            widget: "object"
            fields:
              - { label: "Nome", name: "nome", widget: "string", default: "Ellithon" }
          - label: "Líder 2"
            name: "lider2"
            widget: "object"
            fields:
              - { label: "Nome", name: "nome", widget: "string", default: "Jhennifer" }
          - { label: "Foto dos Líderes", name: "foto_lideres", widget: "image" }
          - label: "Equipe"
            name: "equipe"
            widget: "list"
            fields:
              - { label: "Nome", name: "nome", widget: "string" }
              - { label: "Cargo", name: "cargo", widget: "string" }
              - { label: "Foto", name: "foto", widget: "image" }

  # ─── MINISTÉRIOS ─────────────────────────────────
  - name: "ministerios"
    label: "🔥 Ministérios"
    label_singular: "Ministério"
    folder: "content/ministerios"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Nome do Ministério", name: "nome", widget: "string" }
      - { label: "Descrição", name: "descricao", widget: "text" }
      - { label: "Foto", name: "foto", widget: "image" }
      - { label: "Destaque?", name: "destaque", widget: "boolean", default: false }
      - { label: "Instagram (opcional)", name: "instagram", widget: "string", required: false }

  # ─── EVENTOS ─────────────────────────────────────
  - name: "eventos"
    label: "🎉 Eventos"
    label_singular: "Evento"
    folder: "content/eventos"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Nome do Evento", name: "nome", widget: "string" }
      - { label: "Data", name: "data", widget: "datetime", format: "DD/MM/YYYY" }
      - { label: "Descrição", name: "descricao", widget: "text" }
      - { label: "Tipo", name: "tipo", widget: "select", options: ["Culto", "Célula", "Regional", "Confraternização", "Acampamento", "Especial"] }
      - { label: "Foto (opcional)", name: "foto", widget: "image", required: false }
      - { label: "Destaque na home?", name: "destaque", widget: "boolean", default: false }
      - { label: "Sujeito a alterações?", name: "alteracoes", widget: "boolean", default: true }

  # ─── GALERIA ─────────────────────────────────────
  - name: "galeria"
    label: "🖼️ Galeria de Fotos"
    label_singular: "Foto"
    folder: "content/galeria"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Título / Legenda", name: "titulo", widget: "string" }
      - { label: "Foto", name: "foto", widget: "image" }
      - { label: "Categoria", name: "categoria", widget: "select", options: ["Culto", "Jovens", "Crianças", "Dança", "Eventos", "Liderança"] }
