backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "site"
    label: "Configurações do Site"
    files:
      - file: "content/site.json"
        label: "Geral"
        name: "geral"
        fields:
          - { label: "Imagem do Banner", name: "banner", widget: "image" }
          - { label: "Imagem Sobre", name: "sobre_img", widget: "image" }
          - { label: "Imagem Igreja", name: "igreja_img", widget: "image" }
